services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: actionpoints
      POSTGRES_USER: actionpoints
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - actionpoints_dev_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U actionpoints -d actionpoints"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  actionpoints_dev_db:
